version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hookd_postgres
    environment:
      POSTGRES_DB: hookd_db
      POSTGRES_USER: hookd
      POSTGRES_PASSWORD: hookd123
    ports:
      - "5432:5432"
    volumes:
      - hookd_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookd -d hookd_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hookd_network

  minio:
    image: minio/minio:latest
    container_name: hookd_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - hookd_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - hookd_network

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: hookd_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/hookd-media --ignore-existing;
      /usr/bin/mc anonymous set public myminio/hookd-media;
      exit 0;
      "
    networks:
      - hookd_network

volumes:
  hookd_pg_data:
    driver: local
  hookd_minio_data:
    driver: local

networks:
  hookd_network:
    driver: bridge
